<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Results</title>
  <link rel="stylesheet" href="assets/css/soft-design-system.css">
</head>
<body>
  <main class="container py-5">
    <div class="row">
      <div class="col-lg-3 mb-lg-0 mb-3">
        <ul class="nav flex-column bg-white border-radius-lg p-3 position-sticky top-1">
          <li class="nav-item"><a class="nav-link text-dark" href="#perfil">Profile</a></li>
          <li class="nav-item"><a class="nav-link text-dark" href="#tipo">Creativity Type</a></li>
          <li class="nav-item"><a class="nav-link text-dark" href="#sistema">Recommended System</a></li>
          <li class="nav-item"><a class="nav-link text-dark" href="#capacidades">Capabilities</a></li>
          <li class="nav-item"><a class="nav-link text-dark" href="#ideas">Idea Generation</a></li>
          <li class="nav-item"><a class="nav-link text-dark" href="#programas">Recommended Programs</a></li>
        </ul>
      </div>
      <div class="col-lg-9">
        <div class="card shadow-lg mb-5">
          <div class="card-body p-5">
            <div id="result-content">
              <section id="perfil" class="mb-4">
                <div class="d-flex align-items-start">
                  <img id="perfil-imagen" src="" alt="profile image" style="width:120px;height:120px;object-fit:cover;border-radius:8px;margin-right:16px;display:none" />
                  <div>
                    <h4 class="perfil-nombre-repeat"></h4>
                    <h3 id="perfil-nombre-detail" class="perfil-nombre-repeat"></h3>
                    <blockquote id="perfil-frase" class="blockquote"></blockquote>
                    <p id="perfil-descripcion"></p>
                  </div>
                </div>
              </section>

              <section id="tipo" class="mb-4">
                <h4>Creativity Type</h4>
                <h5 id="tipo-titulo"></h5>
                <p id="tipo-desc"></p>
                <!-- radar of 12 profiles will be placed here (replaces two separate radars) -->
                <div class="mt-3">
                  <canvas id="radar-profiles-canvas" width="700" height="520" style="max-width:100%;height:auto;border:1px solid #eee;background:#fff;"></canvas>
                </div>
                
              </section>

              <section id="sistema" class="mb-4">
                <h4>Recommended System</h4>
                <h5 id="sistema-titulo"></h5>
                <p id="sistema-desc"></p>
                <!-- removed individual system radar; replaced by profiles radar above -->
              </section>

              <!-- removed combined matrix; using two radars below -->

              <section id="capacidades" class="mb-4">
                <h4>Capabilities</h4>
                <ul id="capacidades-list"></ul>
              </section>

              <section id="ideas" class="mb-4">
                <h4>Idea Generation</h4>
                <ul id="ideas-list"></ul>
              </section>

              <section id="programas" class="mb-4">
                <h4>Recommended Programs</h4>
                <ul id="programas-list"></ul>
              </section>

              <div class="text-center mt-4">
                <a href="quizen.html" class="btn btn-primary me-2">Retake the quiz</a>
                <button id="clear-btn" class="btn btn-outline-secondary">Clear results</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Load English quiz data then init
    (function(){
      var s = document.createElement('script');
      s.src = 'quiz-data-en.js';
      s.onload = initResults;
      s.onerror = initResults;
      document.head.appendChild(s);
      function initResults(){
        try {
          let raw = null;
          try { raw = localStorage.getItem('quiz_result'); } catch(e) { raw = null; }
          if (!raw) { try { raw = sessionStorage.getItem('quiz_result'); } catch(e) { raw = null; } }
          if (!raw) {
            document.getElementById('perfil-nombre').textContent = 'No results available';
            return;
          }
          const data = JSON.parse(raw || '{}');
          document.getElementById('perfil-descripcion').textContent = data.perfilDescripcion || '';

          const comboKey = data.results && data.results.creativity && data.results.system ? `${data.results.creativity}_${data.results.system}` : null;
          let perfilData = comboKey && window.perfilesCombinados && window.perfilesCombinados[comboKey] ? window.perfilesCombinados[comboKey] : null;
          if (!perfilData && window.perfilesCombinados) {
            const entries = Object.values(window.perfilesCombinados);
            perfilData = entries.find(e => e.nombre && e.nombre.toLowerCase() === (data.perfilNombre||'').toLowerCase());
          }
          if (perfilData) {
            if (perfilData.imagen) { const img = document.getElementById('perfil-imagen'); img.src = perfilData.imagen; img.style.display = ''; }
            const perfilNombre = perfilData.nombre || data.perfilNombre || '';
            document.querySelectorAll('.perfil-nombre-repeat').forEach(el => { el.textContent = perfilNombre; });
            document.getElementById('perfil-frase').textContent = perfilData.frase || '';
            if (Array.isArray(perfilData.creatividadTipo)) { document.getElementById('tipo-titulo').textContent = perfilData.creatividadTipo[0] || ''; document.getElementById('tipo-desc').textContent = perfilData.creatividadTipo[1] || ''; }
            if (Array.isArray(perfilData.sistemaTipo)) { document.getElementById('sistema-titulo').textContent = perfilData.sistemaTipo[0] || ''; document.getElementById('sistema-desc').textContent = perfilData.sistemaTipo[1] || ''; }
            const capList = document.getElementById('capacidades-list'); capList.innerHTML = ''; (perfilData.capacidades||[]).forEach(i=>{const li=document.createElement('li');li.textContent=i;capList.appendChild(li);});
            const genList = document.getElementById('ideas-list'); genList.innerHTML = ''; (perfilData.generaciónIdeas||perfilData.generacionIdeas||[]).forEach(i=>{const li=document.createElement('li');li.textContent=i;genList.appendChild(li);});
            const progList = document.getElementById('programas-list'); progList.innerHTML = ''; (perfilData.programasRecomendados||[]).forEach(i=>{const li=document.createElement('li');li.textContent=i;progList.appendChild(li);});
            // draw single radar with 12 profile scores (no axis labels; show name on hover)
            try {
              const canvas = document.getElementById('radar-profiles-canvas');
              if (canvas && window.perfilesCombinados && data.results && data.results.scores) {
                const scores = data.results.scores;
                const creativityScores = scores.creativity || {};
                const systemScores = scores.system || {};
                const comboKeys = Object.keys(window.perfilesCombinados || {});
                const labels = [];
                const values = [];
                comboKeys.forEach(key => {
                  const parts = key.split('_');
                  const cKey = parts[0];
                  const sKey = parts[1];
                  const cVal = (creativityScores[cKey] != null) ? Number(creativityScores[cKey]) : 0;
                  const sVal = (systemScores[sKey] != null) ? Number(systemScores[sKey]) : 0;
                  const total = cVal + sVal;
                  const perfilObj = window.perfilesCombinados[key] || {};
                  labels.push(perfilObj.nombre || key);
                  values.push(total);
                });

                const ctx = canvas.getContext('2d');
                const w = canvas.width; const h = canvas.height; ctx.clearRect(0,0,w,h); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
                const cx = w/2, cy = h/2; const margin = 80; const radius = Math.min(w,h)/2 - margin; const n = labels.length || 1; const angleStep = (Math.PI*2)/n;
                // compute theoretical maximums from quizData so radar limit equals max possible profile score
                function computeMaxPossibleScores(quizData){
                  const maxCreat = {}; const maxSys = {};
                  if (!quizData || !Array.isArray(quizData.preguntas)) return {creativity: maxCreat, system: maxSys};
                  quizData.preguntas.forEach(section => {
                    (section.preguntas || []).forEach(q => {
                      if (!q.scoring) return;
                      if (q.scoring.creatividad) {
                        Object.keys(q.scoring.creatividad).forEach(type => {
                          if (!maxCreat[type]) maxCreat[type] = 0;
                          if (q.tipo === 'seleccion') {
                            const arr = q.scoring.creatividad[type] || [];
                            const mx = arr.length ? Math.max.apply(null, arr.map(n=>Number(n)||0)) : 0;
                            maxCreat[type] += mx;
                          } else if (q.tipo === 'ordenamiento') {
                            const itemScores = q.scoring.creatividad[type] || {};
                            const vals = Object.keys(itemScores).map(k => Number(itemScores[k])||0);
                            const mx = vals.length ? Math.max.apply(null, vals) : 0;
                            maxCreat[type] += mx;
                          }
                        });
                      }
                      if (q.scoring.sistema) {
                        Object.keys(q.scoring.sistema).forEach(type => {
                          if (!maxSys[type]) maxSys[type] = 0;
                          if (q.tipo === 'seleccion') {
                            const arr = q.scoring.sistema[type] || [];
                            const mx = arr.length ? Math.max.apply(null, arr.map(n=>Number(n)||0)) : 0;
                            maxSys[type] += mx;
                          } else if (q.tipo === 'ordenamiento') {
                            const itemScores = q.scoring.sistema[type] || {};
                            const vals = Object.keys(itemScores).map(k => Number(itemScores[k])||0);
                            const mx = vals.length ? Math.max.apply(null, vals) : 0;
                            maxSys[type] += mx;
                          }
                        });
                      }
                    });
                  });
                  return {creativity: maxCreat, system: maxSys};
                }
                const all = values.map(Number).filter(n=>!isNaN(n)); const rawMax = all.length ? Math.max(...all) : 1;
                const maxPossible = computeMaxPossibleScores(window.quizData || window.quizData);
                const profileMaxes = comboKeys.map(key => {
                  const parts = key.split('_'); const cKey = parts[0]; const sKey = parts[1];
                  const mc = (maxPossible.creativity && maxPossible.creativity[cKey]) ? Number(maxPossible.creativity[cKey]) : 0;
                  const ms = (maxPossible.system && maxPossible.system[sKey]) ? Number(maxPossible.system[sKey]) : 0;
                  return mc + ms;
                });
                const profileMax = profileMaxes.length ? Math.max(...profileMaxes) : (rawMax + 10);
                // add 10% padding for visual breathing room
                const maxVal = Math.ceil((profileMax || (rawMax + 10)) * 1.10);

                // draw grid
                const levels = 4; ctx.strokeStyle='#ddd'; ctx.lineWidth=1;
                for (let lvl=1; lvl<=levels; lvl++){
                  const r = radius * (lvl/levels);
                  ctx.beginPath();
                  for (let i=0;i<n;i++){
                    const a = -Math.PI/2 + i*angleStep;
                    const x = cx + r * Math.cos(a);
                    const y = cy + r * Math.sin(a);
                    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                  }
                  ctx.closePath(); ctx.stroke();
                }

                // draw axes (no labels)
                ctx.strokeStyle='#f5f5f5';
                for (let i=0;i<n;i++){
                  const a = -Math.PI/2 + i*angleStep;
                  const x = cx + radius * Math.cos(a);
                  const y = cy + radius * Math.sin(a);
                  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
                }

                // compute points for hover
                const radarPoints = [];
                for (let i=0;i<n;i++){
                  const v = (values[i] != null) ? Number(values[i]) : 0;
                  const r = maxVal ? (v/maxVal)*radius : 0;
                  const a = -Math.PI/2 + i*angleStep;
                  const x = cx + r*Math.cos(a);
                  const y = cy + r*Math.sin(a);
                  radarPoints.push({x, y, label: labels[i], value: v});
                }

                // polygon
                ctx.beginPath();
                for (let i=0;i<n;i++){
                  const p = radarPoints[i];
                  if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
                }
                ctx.closePath(); ctx.strokeStyle='#007bff'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='#007bff'; ctx.globalAlpha=0.14; ctx.fill(); ctx.globalAlpha=1;

                // points and numeric values
                for (let i=0;i<n;i++){
                  const p = radarPoints[i];
                  ctx.beginPath(); ctx.fillStyle='#007bff'; ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
                  ctx.fillStyle='#111'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(String(p.value), p.x, p.y - 8);
                }

                // tooltip element
                let tooltip = document.getElementById('radar-tooltip');
                if (!tooltip) {
                  tooltip = document.createElement('div');
                  tooltip.id = 'radar-tooltip';
                  tooltip.style.position = 'absolute';
                  tooltip.style.pointerEvents = 'none';
                  tooltip.style.padding = '6px 8px';
                  tooltip.style.background = 'rgba(0,0,0,0.78)';
                  tooltip.style.color = '#fff';
                  tooltip.style.borderRadius = '4px';
                  tooltip.style.fontSize = '13px';
                  tooltip.style.transition = 'opacity 120ms ease';
                  tooltip.style.opacity = '0';
                  tooltip.style.zIndex = 9999;
                  document.body.appendChild(tooltip);
                }

                function showTooltip(text, clientX, clientY){
                  tooltip.textContent = text;
                  const pad = 10;
                  const docLeft = (window.scrollX || window.pageXOffset || 0) + clientX + pad;
                  const docTop = (window.scrollY || window.pageYOffset || 0) + clientY + pad;
                  tooltip.style.left = docLeft + 'px';
                  tooltip.style.top = docTop + 'px';
                  tooltip.style.opacity = '1';
                }
                function hideTooltip(){ tooltip.style.opacity = '0'; }

                // hit testing on mousemove
                function getMousePos(evt){
                  const rect = canvas.getBoundingClientRect();
                  return { x: (evt.clientX - rect.left) * (canvas.width / rect.width), y: (evt.clientY - rect.top) * (canvas.height / rect.height), clientX: evt.clientX, clientY: evt.clientY };
                }

                canvas.addEventListener('mousemove', function(evt){
                  // use client-space hit testing for reliability when canvas is scaled
                  const rect = canvas.getBoundingClientRect();
                  let found = null;
                  const thresholdClient = 12; // px in screen coords
                  for (let i=0;i<radarPoints.length;i++){
                    const p = radarPoints[i];
                    const pointClientX = rect.left + (p.x * (rect.width / canvas.width));
                    const pointClientY = rect.top + (p.y * (rect.height / canvas.height));
                    const dx = evt.clientX - pointClientX; const dy = evt.clientY - pointClientY; const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist <= thresholdClient){ found = {point: p, clientX: pointClientX, clientY: pointClientY}; break; }
                  }
                  if (found){
                    // position tooltip near the graph point
                    showTooltip(found.point.label + ' — ' + found.point.value, found.clientX, found.clientY);
                    if (window && window.console && console.debug) console.debug('radar hover', found.point.label, found.point.value);
                  } else { hideTooltip(); }
                });
                canvas.addEventListener('mouseleave', function(){ hideTooltip(); });
              }
            } catch(e){ console.warn('Failed drawing profiles radar:', e); }
          }
        } catch (e) { console.warn('Failed to init results page:', e); }

        document.getElementById('clear-btn').addEventListener('click', function(){ try{localStorage.removeItem('quiz_result')}catch(e){} try{sessionStorage.removeItem('quiz_result')}catch(e){} location.href='quizen.html'; });
      }
    })();
  </script>
</body>
</html>
